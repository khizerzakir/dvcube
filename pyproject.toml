readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "xarray>=2025.6.1",
    "zarr>=2.18.3",
    "numpy>=2.2.6",
    "pandas>=2.3.2",
    "matplotlib>=3.10.6",
    "netcdf4>=1.7.3",
    "psutil>=5.9.0",
    "scipy>=1.15.3",
    "rioxarray>=0.19.0",
    "h5netcdf>=1.6.4",
    "cartopy>=0.25.0",
    "geopandas>=1.1.1",
    "shapely",
    "dask[distributed]>=2025.10.0",
    "virtualizarr[hdf,icechunk]>=1.2.0",
]
