    "shapely",
    "dask[distributed]>=2025.10.0",
    "ipykernel>=7.2.0",
    "jupyter>=1.1.1",
    "xarray>=2025.11.0",
    "h5py>=3.15.1",
    "lexcube>=1.0.3",
