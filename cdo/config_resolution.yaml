# CDO Grid Configuration
# Automatically generates grid.txt based on resolution

# Domain boundaries (in degrees)
domain:
  lon_min: -20.0
  lon_max: 55.0
  lat_min: 10.0
  lat_max: 20.0

# Dataset resolutions (in degrees)
# Change this value and run: python3 generate_grid.py --resolution <value>
datasets:
  metref:
    resolution: 0.05
  
  sm:
    resolution: 0.1
  
  custom:
    resolution: 0.02
